name: Bug report
description: Report a reproducible problem in Liberty Browser.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security issues, follow SECURITY.md instead of opening a public issue. Never include passwords, cookies, browser profiles, or private account data."
  - type: input
    id: version
    attributes:
      label: Liberty Browser version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal example and a public or local test page where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
